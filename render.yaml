services:
  - type: web
    name: sala-de-proyeccion
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: VIDEO_PROVIDER
        value: wan2.2-free
      - key: WAN_SPACE_ID
        value: Upsampler/wan-2-2-5b-video
      - key: WAN_MODEL
        value: Wan2.2
      - key: WAN_STEPS
        value: "8"
      - key: WAN_GUIDE_SCALE
        value: "5"
      - key: WAN_FRAMES
        value: "49"
      - key: WAN_CONNECT_TIMEOUT_MS
        value: "45000"
      - key: HF_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
