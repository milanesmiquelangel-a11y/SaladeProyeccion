services:
  - type: web
    name: sala-de-proyeccion
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: VIDEO_PROVIDER
        value: ltx-2-3
      - key: IMAGE_VIDEO_ENGINE
        value: ltx-2-3
      - key: LTX_FREE_SPACE
        value: Lightricks/LTX-2-3
      - key: LTX_FREE_ENDPOINT
        value: /generate_video
      - key: HF_TOKEN
        sync: false
