services:
  - type: web
    name: sala-de-proyeccion
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: VIDEO_PROVIDER
        value: wan2.1-i2v-fast
      - key: IMAGE_VIDEO_ENGINE
        value: wan-free
      - key: WAN_FREE_SPACE
        value: multimodalart/wan2-1-fast
      - key: WAN_FREE_ENDPOINT
        value: /generate_video
      - key: HF_TOKEN
        sync: false
