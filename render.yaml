services:
  - type: web
    name: sala-de-proyeccion
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PIXAZO_API_KEY
        sync: false
      - key: PIXAZO_VIDEO_URL
        value: https://gateway.pixazo.ai/ltx-video/v1/text-to-video
      - key: VIDEO_PROVIDER
        value: pixazo-ltx-free
      - key: IMAGE_VIDEO_ENGINE
        value: freeai
      - key: FREEAI_TALKING_HEAD_ENDPOINT
        value: https://api.free.ai/v1/video/talking-head/
      - key: FREEAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
