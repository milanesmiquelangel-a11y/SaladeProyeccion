services:
  - type: web
    name: sala-de-proyeccion
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: VIDEO_PROVIDER
        value: sadtalker
      - key: IMAGE_VIDEO_ENGINE
        value: sadtalker
      - key: SADTALKER_FREE_SPACE
        value: henrybit/SadTalker-Demo
      - key: SADTALKER_FREE_ENDPOINT
        value: /generate
      - key: HF_TOKEN
        sync: false
