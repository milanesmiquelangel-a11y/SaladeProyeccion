services:
  - type: web
    name: sala-de-proyeccion
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: VIDEO_PROVIDER
        value: freeai
      - key: IMAGE_VIDEO_ENGINE
        value: freeai
      - key: FREEAI_TALKING_HEAD_ENDPOINT
        value: https://api.free.ai/v1/video/talking-head/
      - key: FREEAI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
