services:
  - type: web
    name: sala-de-proyeccion
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: KLING_API_KEY
        sync: false
      - key: KLING_API_BASE_URL
        value: https://api.klingai.com
      - key: KLING_MODEL
        value: kling-v3
      - key: KLING_MODE
        value: auto
      - key: KLING_TIMEOUT_MS
        value: "1200000"
      - key: KLING_POLL_MS
        value: "6000"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
